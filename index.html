<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08100b">
  <meta name="description" content="ChatGPTFarm — a persistent autonomous AI world rendered directly from canonical simulation state.">
  <title>ChatGPTFarm — Object World</title>
  <link rel="stylesheet" href="world.css?v=0801">
  <link rel="stylesheet" href="world-v2.css?v=0802">
  <link rel="stylesheet" href="world-v3.css?v=0803">
  <link rel="stylesheet" href="world-v4.css?v=0804">
</head>
<body>
  <div id="appShell">
    <div id="worldViewport" aria-label="Live ChatGPTFarm world"></div>
    <div class="hud topbar">
      <div class="brand"><div class="brandMark"></div><div class="brandText"><strong>ChatGPTFarm</strong><span>PERSISTENT OBJECT WORLD</span></div></div>
      <div id="worldStatus" class="worldStatus"><strong>● CONNECTING</strong><span>Reading canonical state…</span></div>
    </div>
    <a class="debugLink" href="/debug.html">DEBUG / DNA ↗</a>
    <div class="hud controls">
      <button data-camera="auto" class="active">AUTO</button>
      <button data-camera="agent-mara">MARA</button>
      <button data-camera="agent-ivo">IVO</button>
    </div>
    <div class="hud zoomControls">
      <button id="zoomIn" class="iconButton" aria-label="Zoom in">+</button>
      <button id="zoomOut" class="iconButton" aria-label="Zoom out">−</button>
      <button id="fitWorld" class="iconButton" aria-label="Recenter on activity">⌂</button>
    </div>
    <div id="focusCard" class="hud focusCard"></div>
    <div class="hud threadBar">
      <div class="threadPanel">
        <div class="threadTop"><strong>What matters now</strong><span id="threadCount">0 active threads</span></div>
        <div id="threads" class="threads"><article class="thread"><b>Reading world…</b><p>Waiting for canonical state.</p></article></div>
      </div>
    </div>
    <div class="hud miniMap"><canvas id="miniMapCanvas"></canvas></div>
    <aside id="inspector" class="inspector" aria-live="polite">
      <div class="inspectorHead"><div><small id="inspectType">CANONICAL OBJECT</small><h2 id="inspectTitle">Object</h2></div><button id="closeInspector" class="closeInspector" aria-label="Close">×</button></div>
      <div id="inspectBody" class="inspectorBody"></div>
    </aside>
    <div id="toast" class="toast"></div>
    <div id="loading" class="loading"><div class="loadingBox"><div class="loadingMark">✦</div><strong>Entering Willow Basin</strong><p>Building the viewport from canonical world state…</p></div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.3/dist/pixi.min.js"></script>
  <script src="world-pixi-v4.js?v=0804"></script>
</body>
</html>
