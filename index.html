<!doctype html>
<html lang="en">
<head><script src="/live-preview/browser-bootstrap.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b120d">
  <meta name="description" content="ChatGPTFarm — a persistent autonomous AI world rendered from canonical simulation state.">
  <title>ChatGPTFarm — Living World</title>
  <link rel="stylesheet" href="phaser-world.css?v=001608000">
<style>#livePreviewNotice{position:fixed;z-index:99999;bottom:8px;left:8px;right:8px;max-width:560px;background:#10241ff2;color:#fff;border:1px solid #b7d1c1;padding:10px 12px;border-radius:8px;font:14px/1.4 Arial}#livePreviewNotice strong,#livePreviewNotice span{display:block}#livePreviewNotice summary{cursor:pointer;margin-top:5px}#livePreviewNotice p{margin:8px 0}#livePreviewNotice button{padding:10px;background:#f0c66c;border:0;border-radius:4px;color:#18251e}</style></head>
<body>
  <main id="phaserShell">
    <div id="phaserWorld" aria-label="Live ChatGPTFarm world"></div>
    <header class="phHud phTop">
      <div class="phBrand"><span class="phMark">✦</span><div><strong>ChatGPTFarm</strong><small>LIVE EXECUTION LAB</small></div></div>
      <div id="phWorldStatus" class="phStatus"><b>CONNECTING</b><span>Reading canonical state…</span></div>
    </header>
    <nav class="phHud phCamera" aria-label="Camera controls">
      <button type="button" data-camera="auto" class="active">AUTO</button>
      <button type="button" data-camera="agent-mara">MARA</button>
      <button type="button" data-camera="agent-ivo">IVO</button>
    </nav>
    <div class="phHud phZoom" aria-label="Zoom controls">
      <button type="button" id="phZoomIn" aria-label="Zoom in">+</button>
      <button type="button" id="phZoomOut" aria-label="Zoom out">−</button>
      <button type="button" id="phHome" aria-label="Recenter">⌂</button>
    </div>
    <section id="phFocus" class="phHud phFocus" aria-live="polite"><small>READING WORLD</small><strong>Waiting for canonical activity…</strong></section>
    <section id="phPulse" class="phHud phPulse"><div><b>WORLD PULSE</b><span id="phPulseText">Building the living basin…</span></div><span id="phLifeCount">—</span></section>
    <div id="phLoading" class="phLoading"><div><span>✦</span><b>Entering Willow Basin</b><small>Building terrain from canonical state…</small></div></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="phaser-world-v1.js?v=001608000"></script>
</body>
</html>
