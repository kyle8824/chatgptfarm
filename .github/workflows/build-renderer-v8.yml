name: Build renderer v8
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-renderer-v8.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chatgptfarm-renderer-v8
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Build renderer v8
        run: python3 scripts/build-renderer-v8.py
      - name: Validate renderer and simulation
        run: npm test
      - name: Commit renderer v8
        run: |
          git config user.name "ChatGPTFarm Guardian"
          git config user.email "actions@users.noreply.github.com"
          git add world-pixi-v8.js action-visuals-v8.js index.html package.json
          git commit -m "v0.8.4: unify spatial depth and ground features" || exit 0
          git pull --rebase origin main
          git push origin main
