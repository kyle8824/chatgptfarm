name: Build Natural Depth v13.1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-natural-depth-v13_1.py'
      - '.github/workflows/build-natural-depth-v13_1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply natural-depth patch
        run: python3 scripts/apply-natural-depth-v13_1.py
      - name: Validate
        run: |
          node --check world-pixi-v11.js
          node --check scripts/visual-qa.mjs
          npm test
      - name: Commit natural depth
        run: |
          git config user.name 'ChatGPTFarm Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add world-pixi-v11.js scripts/visual-qa.mjs index.html
          git commit -m 'v0.9.5: natural creek banks and terrain relief' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
