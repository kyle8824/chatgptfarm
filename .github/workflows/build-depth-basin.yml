name: Build Depth Basin
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-depth-basin.py'
      - '.github/workflows/build-depth-basin.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply river and depth-layer migration
        run: python3 scripts/apply-depth-basin.py
      - name: Validate engine and renderer
        run: |
          node --check engine/world-model.js
          node --check engine/spectator.js
          node --check world-pixi-v11.js
          node --check scripts/visual-qa.mjs
          npm test
      - name: Commit depth basin
        run: |
          git config user.name 'ChatGPTFarm Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add engine/world-model.js engine/spectator.js world-pixi-v11.js scripts/smoke-test.mjs scripts/visual-qa.mjs index.html
          git commit -m 'v0.9.3: rebuild creek banks and establish depth layers' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
