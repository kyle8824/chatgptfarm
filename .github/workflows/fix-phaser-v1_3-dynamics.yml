name: Fix Phaser v1.3 Dynamics
on:
  push:
    paths:
      - 'scripts/fix-phaser-v1_3-dynamics.mjs'
      - '.github/workflows/fix-phaser-v1_3-dynamics.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Restore dynamics
        run: node scripts/fix-phaser-v1_3-dynamics.mjs
      - name: Validate
        run: |
          node --check phaser-world-v1.js
          node --check scripts/phaser-qa.mjs
          npm test
      - name: Commit restoration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add phaser-world-v1.js phaser.html
          git diff --cached --quiet && exit 0
          git commit -m "phaser: restore v1.3 entity and movement layer"
          git push origin main
