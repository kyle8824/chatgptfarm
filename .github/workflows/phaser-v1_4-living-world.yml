name: Phaser v1.5 Living History
on:
  push:
    branches: [phaser-v1-5-living-history]
    paths:
      - 'phaser-world-v1.js'
      - 'phaser-world.css'
      - 'phaser.html'
      - 'engine.js'
      - 'engine/**'
      - 'mind.js'
      - 'world/**'
      - 'scripts/phaser-qa.mjs'
      - 'scripts/ecology-realism-qa.mjs'
      - 'scripts/living-history-qa.mjs'
      - '.github/workflows/phaser-v1_4-living-world.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check authoritative source
        run: |
          node --check phaser-world-v1.js
          node --check engine.js
          node --check engine/ecology.js
          node --check engine/runtime.js
          node --check engine/decision.js
          node --check engine/physics.js
          node --check engine/spectator.js
          node --check mind.js
          node --check scripts/ecology-realism-qa.mjs
          node --check scripts/living-history-qa.mjs
      - name: Run ecology realism invariants
        run: node scripts/ecology-realism-qa.mjs
      - name: Run living-history invariants
        run: node scripts/living-history-qa.mjs
      - name: Install browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local world
        run: |
          python3 -m http.server 4173 >/tmp/chatgptfarm-phaser-v155.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/phaser.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/chatgptfarm-phaser-v155.log
          exit 1
      - name: Run strict browser QA
        env:
          BASE_URL: http://127.0.0.1:4173/phaser.html
        run: node scripts/phaser-qa.mjs
      - name: Upload focused visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phaser-v1-5-5-authoritative-qa
          path: phaser-qa/
          retention-days: 7
