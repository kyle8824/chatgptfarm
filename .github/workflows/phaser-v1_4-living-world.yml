name: Production Living World Validation
on:
  push:
    branches: [ops-production-architecture-repair, main]
    paths:
      - 'index.html'
      - 'legacy.html'
      - 'phaser-world-v1.js'
      - 'phaser-world.css'
      - 'phaser.html'
      - 'engine.js'
      - 'engine/**'
      - 'mind.js'
      - 'package.json'
      - 'vercel.json'
      - 'scripts/phaser-qa.mjs'
      - 'scripts/ecology-realism-qa.mjs'
      - 'scripts/living-history-qa.mjs'
      - '.github/workflows/phaser-v1_4-living-world.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate committed source
        run: |
          npm test
          node --check engine.js
          node --check engine/core.js
          node --check engine/ecology.js
          node --check engine/runtime.js
          node --check engine/decision.js
          node --check engine/physics.js
          node --check engine/spectator.js
          node --check engine/world-model.js
          node --check mind.js
          node --check scripts/ecology-realism-qa.mjs
          node --check scripts/living-history-qa.mjs
          node --check scripts/phaser-qa.mjs
      - name: Verify production renderer cutover
        run: |
          grep -q 'phaser@3.90.0' index.html
          grep -q 'phaser-world-v1.js' index.html
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; import {BUILD_INFO} from "./cloudflare/build-info.mjs"; assert(fs.readFileSync("index.html","utf8").includes("LIVING WORLD · v"+BUILD_INFO.version),"Page and runtime release versions differ")' 
          grep -q 'pixi.js@7.4.3' legacy.html
          if grep -q 'world-pixi-v11.js' index.html; then
            echo 'Production root still references legacy Pixi renderer.'
            exit 1
          fi
      - name: Run ecology realism invariants
        run: node scripts/ecology-realism-qa.mjs
      - name: Run living-history invariants
        run: node scripts/living-history-qa.mjs
      - name: Install browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local world
        run: |
          python3 -m http.server 4173 >/tmp/chatgptfarm-production.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && curl -fsS http://127.0.0.1:4173/legacy.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/chatgptfarm-production.log
          exit 1
      - name: Run strict browser QA against production root
        env:
          BASE_URL: http://127.0.0.1:4173/
        run: node scripts/phaser-qa.mjs
      - name: Upload focused visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-living-world-qa
          path: phaser-qa/
          retention-days: 7
