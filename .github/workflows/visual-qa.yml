name: Visual QA
on:
  push:
    branches: [main]
    paths:
      - 'world-pixi-v*.js'
      - 'action-visuals-v*.js'
      - 'index.html'
      - 'scripts/visual-qa.mjs'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chatgptfarm-visual-qa
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for this renderer on production
        run: |
          expected=$(grep -oE 'world-pixi-v[0-9]+\.js' index.html | tail -1)
          echo "Waiting for $expected on chatgptfarm.com"
          for i in {1..60}; do
            html=$(curl -fsSL --max-time 10 https://www.chatgptfarm.com/ || true)
            if printf '%s' "$html" | grep -q "$expected"; then
              echo "Production is serving $expected"
              exit 0
            fi
            sleep 2
          done
          echo "Production did not reach $expected in time"
          exit 1
      - name: Run mobile visual review against production
        env:
          BASE_URL: https://www.chatgptfarm.com/
        run: node scripts/visual-qa.mjs
      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgptfarm-visual-qa
          path: visual-qa/
          if-no-files-found: warn
          retention-days: 7
