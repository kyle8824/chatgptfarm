name: Visual QA
on:
  push:
    branches: [main]
    paths:
      - 'world-pixi-v*.js'
      - 'action-visuals-v*.js'
      - 'index.html'
      - 'world-v*.css'
      - 'scripts/visual-qa.mjs'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chatgptfarm-visual-qa
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Choose production or exact local build
        shell: bash
        run: |
          expected=$(grep -oE 'world-pixi-v[0-9]+\.js\?v=[0-9]+' index.html | tail -1)
          html=$(curl -fsSL --max-time 10 https://www.chatgptfarm.com/ || true)
          if [ -n "$expected" ] && printf '%s' "$html" | grep -Fq "$expected"; then
            echo "Visual QA: production is serving exact asset $expected"
            echo "BASE_URL=https://www.chatgptfarm.com/" >> "$GITHUB_ENV"
          else
            echo "Visual QA: production is not serving exact asset $expected; reviewing exact checkout locally"
            python3 -m http.server 4173 > /tmp/chatgptfarm-http.log 2>&1 &
            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
                echo "BASE_URL=http://127.0.0.1:4173/" >> "$GITHUB_ENV"
                exit 0
              fi
              sleep 1
            done
            cat /tmp/chatgptfarm-http.log
            exit 1
          fi
      - name: Run mobile visual review
        run: node scripts/visual-qa.mjs
      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgptfarm-visual-qa
          path: visual-qa/
          if-no-files-found: warn
          retention-days: 7
