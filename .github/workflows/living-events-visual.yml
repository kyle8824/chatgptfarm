name: Build Living Events Visual Layer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/living-events-visual.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply basin geography migration
        run: python3 scripts/apply-basin-geometry.py
      - name: Validate
        run: |
          node --check engine/world-model.js
          node --check engine/ecology.js
          node --check world-pixi-v11.js
          node --check scripts/visual-qa.mjs
          npm test
      - name: Commit basin geography
        run: |
          git config user.name 'ChatGPTFarm Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add engine/world-model.js engine/ecology.js world-pixi-v11.js scripts/visual-qa.mjs
          git commit -m 'v0.9.2: unify canonical creek and Living Basin geography' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
