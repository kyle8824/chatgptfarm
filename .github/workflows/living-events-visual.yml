name: Build Living Events Visual Layer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/living-events-visual.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Living Events spectator polish
        run: python3 scripts/apply-living-events-polish.py
      - name: Validate
        run: |
          node --check world-pixi-v11.js
          npm test
      - name: Commit Living Events polish
        run: |
          git config user.name 'ChatGPTFarm Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add world-pixi-v11.js
          git commit -m 'v0.9.1: polish wildlife visuals and spectator AUTO' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
