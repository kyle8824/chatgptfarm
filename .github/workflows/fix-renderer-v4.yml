name: Fix renderer v4 syntax
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-renderer-v4.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch missing pointer-release brace
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('world-pixi-v4.js')
          s = p.read_text()
          old = "gesture={type:'pan',id:[...pointers.keys()][0],start:q,last:q,cx:camera.x,cy:camera.y,moved:false,time:performance.now()}};cv.addEventListener('pointerup',end);"
          new = "gesture={type:'pan',id:[...pointers.keys()][0],start:q,last:q,cx:camera.x,cy:camera.y,moved:false,time:performance.now()}}};cv.addEventListener('pointerup',end);"
          if old not in s:
              raise SystemExit('target sequence not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check world-pixi-v4.js
      - name: Commit repaired renderer
        run: |
          git config user.name "ChatGPTFarm Guardian"
          git config user.email "actions@users.noreply.github.com"
          git add world-pixi-v4.js
          git commit -m "fix: close v4 pointer-release handler"
          git pull --rebase origin main
          git push origin main
