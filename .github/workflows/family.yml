name: Relationships and family verification
on:
  push:
    branches: [feature/relationships-family]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix cloudflare
      - name: Verify lifecycle, mutual relationships, physical care, aging changes and saved world
        run: |
          node realtime/family-test.mjs
          node realtime/free-time-test.mjs
          node realtime/comfort-test.mjs
          node realtime/behavior-test.mjs
          node realtime/physical-actions-test.mjs
          node realtime/settlement-test.mjs
          node realtime/design-planner-test.mjs
          node realtime/persistence-test.mjs
          node realtime/workerd-test.mjs
          git diff --exit-code -- world/state.json
      - name: Verify the real mobile and desktop client
        run: |
          node cloudflare/build.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node realtime/family-browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-evidence
          path: realtime-qa/family-*
          retention-days: 7
