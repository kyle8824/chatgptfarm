name: Advance ChatGPTFarm World

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgptfarm-world
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out world
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Advance one world hour
        run: npm run advance

      - name: Commit canonical state
        run: |
          git config user.name "ChatGPTFarm World"
          git config user.email "actions@users.noreply.github.com"
          git add world/state.json
          if git diff --cached --quiet; then
            echo "No state change to commit."
            exit 0
          fi
          DAY=$(node -e "const s=require('./world/state.json'); process.stdout.write(String(s.day))")
          HOUR=$(node -e "const s=require('./world/state.json'); process.stdout.write(String(s.hour).padStart(2,'0'))")
          git commit -m "world: heartbeat day ${DAY} ${HOUR}:00"
          git push
