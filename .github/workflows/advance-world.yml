name: Advance ChatGPTFarm World
# Canonical heartbeats also apply versioned world/ecology migrations before decisions.
# object-field-0.9 realigns creek, stone field, clay bank, and depth-aware basin rendering.

# Cloudflare FarmWorld/preview-v1 owns the public world. Retain this workflow
# only for an explicitly configured legacy environment; never run two writers.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgptfarm-world
  cancel-in-progress: false

jobs:
  advance:
    if: ${{ vars.WORLD_RUNTIME == 'github-legacy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out world
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate four simulated world-days
        run: npm test

      - name: Advance canonical world through bounded mind
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
          OPENAI_REASONING_EFFORT: low
        run: npm run advance

      - name: Commit canonical state
        run: |
          git config user.name "ChatGPTFarm World"
          git config user.email "actions@users.noreply.github.com"
          git add world/state.json
          if git diff --cached --quiet; then
            echo "No state change to commit."
            exit 0
          fi
          DAY=$(node -e "const s=require('./world/state.json'); process.stdout.write(String(s.day))")
          HOUR=$(node -e "const s=require('./world/state.json'); process.stdout.write(String(s.hour).padStart(2,'0'))")
          MODE=$(node -e "const s=require('./world/state.json'); process.stdout.write(String(s.meta?.mindMode || 'fallback'))")
          PHYSICS=$(node -e "const s=require('./world/state.json'); process.stdout.write(String(s.meta?.physicsVersion || 'legacy'))")
          git commit -m "world: heartbeat day ${DAY} ${HOUR}:00 [${MODE}] [${PHYSICS}]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main