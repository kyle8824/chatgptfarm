name: Build Composition Depth
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-composition-depth.py'
      - '.github/workflows/build-composition-depth.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply composition-depth patch
        run: python3 scripts/apply-composition-depth.py
      - name: Validate
        run: |
          node --check world-pixi-v11.js
          node --check scripts/visual-qa.mjs
          npm test
      - name: Commit composition depth
        run: |
          git config user.name 'ChatGPTFarm Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add world-pixi-v11.js scripts/visual-qa.mjs
          git commit -m 'v0.9.3: enforce composition clearance and bank relief' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
