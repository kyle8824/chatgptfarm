name: Build Living Basin Renderer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-living-basin-renderer.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chatgptfarm-living-basin-renderer
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Build living basin renderer
        run: python3 scripts/build-living-basin-renderer.py
      - name: Validate renderer and simulation
        run: npm test
      - name: Commit living basin renderer
        run: |
          git config user.name "ChatGPTFarm Guardian"
          git config user.email "actions@users.noreply.github.com"
          git add world-pixi-v11.js action-visuals-v11.js index.html package.json world-v6.css scripts/build-living-basin-renderer.py api/control.js
          git commit -m "v0.9: living basin wildlife river and world pulse" || exit 0
          git pull --rebase origin main
          git push origin main
