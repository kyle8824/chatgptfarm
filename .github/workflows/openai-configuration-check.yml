name: OpenAI configuration check
on:
  push:
    branches: [fix/openai-household]
    paths: [.github/workflows/openai-configuration-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check saved credentials without revealing their values
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          for (const name of ['OPENAI_API_KEY','CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID']) {
            console.log(name + ': ' + (process.env[name] ? 'present' : 'absent'));
          }
          if (process.env.OPENAI_API_KEY) {
            try {
              // Model metadata is read-only; this generates no paid response.
              const response = await fetch('https://api.openai.com/v1/models/gpt-5.6-luna', {
                headers: {Authorization: 'Bearer ' + process.env.OPENAI_API_KEY},
                signal: AbortSignal.timeout(20000)
              });
              const data = await response.json().catch(() => ({}));
              console.log('OpenAI model-access HTTP status: ' + response.status);
              console.log('Requested model available: ' + (response.ok && data.id === 'gpt-5.6-luna'));
            } catch {
              console.log('OpenAI model-access check: network failure');
            }
          }
          JS
