name: Build renderer v6
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-renderer-v6.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Build renderer v6
        run: python3 scripts/patch-renderer-v6.py
      - name: Validate renderer and simulation
        run: npm test
      - name: Commit renderer v6
        run: |
          git config user.name "ChatGPTFarm Guardian"
          git config user.email "actions@users.noreply.github.com"
          git add world-pixi-v6.js index.html package.json
          git commit -m "v0.8.2: show materials during actions" || exit 0
          git pull --rebase origin main
          git push origin main
