name: Build World Quality v13
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-world-quality-v13.py'
      - '.github/workflows/build-world-quality-v13.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply world-quality patch
        run: |
          python3 scripts/apply-world-quality-v13.py
          git checkout -- .github/workflows/visual-qa.yml
      - name: Validate renderer, QA and world
        run: |
          node --check world-pixi-v11.js
          node --check scripts/visual-qa.mjs
          npm test
      - name: Commit world quality v13
        run: |
          git config user.name 'ChatGPTFarm Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add world-pixi-v11.js scripts/visual-qa.mjs index.html
          git commit -m 'v0.9.4: fix heartbeat camera, organic creek and visual QA' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
