name: Material supply verification
on:
  push:
    branches: [fix/material-supply]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix cloudflare
      - run: npm ci --prefix character-preview
      - name: Read current public world before release
        run: OBSERVE_ONLY=1 node realtime/live-release-check.mjs
      - name: Supply, survival and construction regression checks
        run: |
          node realtime/material-supply-test.mjs
          node realtime/building-flow-test.mjs
          node realtime/thermal-return-test.mjs
          node realtime/cold-preparation-test.mjs
          node realtime/material-search-test.mjs
          node realtime/construction-stages-test.mjs
          node realtime/structure-lifecycle-test.mjs
          node realtime/craft-test.mjs
          node realtime/hewn-construction-test.mjs
          node realtime/persistence-test.mjs
          node realtime/planner-budget-test.mjs
          node realtime/provider-test.mjs
          node structure-workshop/test.mjs
      - name: Actual Worker runtime and deploy build
        run: |
          TEST_FRONTIER=1 TEST_LANDSCAPE=1 STREAM_TEST_MS=60000 node realtime/workerd-test.mjs
          npm run check --prefix cloudflare
          git diff --exit-code -- world/state.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-supply-evidence
          path: realtime-qa/*.json
