<!doctype html><meta charset="utf-8"><title>Tiny Farm Atlas</title><style>body{margin:0;background:#111;color:white;font:12px monospace;padding:16px}.grid{display:grid;grid-template-columns:repeat(12,72px);gap:6px}.cell{width:72px;height:86px;background:#222;border:1px solid #444;display:flex;flex-direction:column;align-items:center;justify-content:center}.cell img{width:64px;height:64px;image-rendering:pixelated}.cell b{margin-top:4px}</style><div class="grid" id="g"></div><script>const ROOT='https://raw.githubusercontent.com/Tiddybub/2d-assets/e0cbe0d995554a490d4c182fe9beb8769ffbb606/fantasy/tiny-farm/Tiles/';for(let i=0;i<132;i++){const d=document.createElement('div');d.className='cell';const n=String(i).padStart(4,'0');d.innerHTML=`<img src="${ROOT}tile_${n}.png"><b>${i}</b>`;g.appendChild(d)}</script>
